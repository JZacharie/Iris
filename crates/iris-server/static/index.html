<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <title>Iris — Observabilité & Organisation</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface2: #1e293b;
      --border: #263349;
      --primary: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --crit: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    .app { display: flex; flex-direction: row; height: 100vh; width: 100vw; overflow: hidden; }
    .sidebar {
      width: 248px; min-width: 248px; height: 100vh;
      background: linear-gradient(180deg, rgba(15,23,42,0.98) 0%, rgba(9,13,22,0.99) 100%);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 30;
      transition: width 0.22s ease, min-width 0.22s ease;
      user-select: none;
    }
    .sidebar.collapsed { width: 66px; min-width: 66px; }
    .sidebar.hidden { display: none; }
    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 14px 12px; border-bottom: 1px solid var(--border);
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .brand-logo {
      width: 32px; height: 32px; min-width: 32px; border-radius: 9px;
      background: linear-gradient(135deg, rgba(56,189,248,0.25), rgba(168,85,247,0.25));
      border: 1px solid var(--primary); display: flex; align-items: center; justify-content: center;
      font-size: 16px; box-shadow: 0 0 12px rgba(56,189,248,0.25);
    }
    .brand { font-weight: 800; color: var(--primary); letter-spacing: 0.1em; font-size: 15px; line-height: 1.1; }
    .brand-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .sidebar-collapse-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      width: 26px; height: 26px; border-radius: 7px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 11px;
    }
    .sidebar-collapse-btn:hover { border-color: var(--primary); color: var(--primary); }
    .sidebar-nav {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 8px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .nav-section { display: flex; flex-direction: column; gap: 3px; }
    .nav-section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--muted); padding: 4px 10px 4px; white-space: nowrap; overflow: hidden;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px 10px; border-radius: 9px; border: 1px solid transparent;
      background: transparent; color: var(--text); cursor: pointer;
      font-size: 13px; text-align: left; white-space: nowrap; overflow: hidden;
      transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    }
    .nav-item:hover { background: rgba(30,41,59,0.75); border-color: var(--border); }
    .nav-item.active {
      background: rgba(56,189,248,0.16); border-color: rgba(56,189,248,0.45);
      border-left: 3px solid var(--primary); color: var(--primary); font-weight: 600;
    }
    .nav-icon { font-size: 16px; min-width: 22px; text-align: center; line-height: 1; }
    .nav-text { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .nav-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 999px;
      background: rgba(56,189,248,0.18); color: var(--primary); font-weight: 700;
    }
    .sidebar-footer {
      padding: 10px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px; background: rgba(9,13,22,0.65);
    }
    .sidebar.collapsed .brand-text,
    .sidebar.collapsed .nav-section-title,
    .sidebar.collapsed .nav-text,
    .sidebar.collapsed .nav-badge,
    .sidebar.collapsed #mqtt-label,
    .sidebar.collapsed .barthes-label-text { display: none; }
    .sidebar.collapsed .sidebar-header { justify-content: center; padding: 12px 6px; }
    .sidebar.collapsed .brand-wrap { display: none; }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 10px 6px; }
    .sidebar.collapsed .mqtt-badge,
    .sidebar.collapsed .barthes-pill { justify-content: center; padding: 6px; }
    .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; overflow: hidden; }
    .pills { display: flex; gap: 8px; overflow-x: auto; align-items: center; }
    .pill {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; font-size: 13px;
    }
    .pill.active { background: rgba(56,189,248,0.2); border-color: var(--primary); color: var(--primary); font-weight: 600; }
    .mqtt-badge {
      display: flex; align-items: center; gap: 6px; padding: 6px 10px;
      border-radius: 10px; background: var(--surface2); font-size: 12px; border: 1px solid var(--border);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.CONNECTED { background: var(--ok); }
    .dot.CONNECTING { background: var(--warn); }
    .dot.ERROR { background: var(--crit); }
    .btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 6px 11px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .btn.primary { background: var(--primary); color: #041e2b; border-color: var(--primary); font-weight: 600; }
    .btn.danger { background: rgba(239,68,68,0.2); border-color: var(--crit); color: #fecaca; }
    .btn.ok { background: rgba(34,197,94,0.2); border-color: var(--ok); color: #bbf7d0; }
    .alert-banner {
      display: none; align-items: center; justify-content: space-between; gap: 16px;
      margin: 8px 12px 0; padding: 10px 16px; border-radius: 12px;
      background: rgba(239,68,68,0.18); border: 1.5px solid var(--crit);
    }
    .alert-banner.visible { display: flex; }
    .alert-tag { background: var(--crit); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; margin-right: 8px; }
    .stage { flex: 1; position: relative; overflow: hidden; }
    iframe.dashboard-frame { width: 100%; height: 100%; border: none; background: var(--bg); }
    .org-view { height: 100%; overflow-y: auto; padding: 24px; }
    .grid-2 { display: grid; grid-template-columns: 0.42fr 0.58fr; gap: 20px; height: 100%; }
    .col { display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .clock-big { font-size: 64px; font-weight: 800; line-height: 1.05; }
    .date-sub { color: var(--primary); font-size: 18px; margin-top: 6px; }
    .launchers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .launcher {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; cursor: pointer; text-align: left; color: var(--text);
    }
    .launcher:hover { border-color: var(--primary); }
    .note-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
    }
    .note-row.done span.txt { text-decoration: line-through; color: var(--muted); }
    .floating-hud-btn {
      position: fixed; top: 12px; left: 12px; z-index: 40; display: none;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }
    .floating-hud-btn.visible { display: block; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none;
      align-items: center; justify-content: center; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      width: min(900px, 92vw); max-height: 88vh; overflow-y: auto; padding: 24px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .field label { font-size: 12px; color: var(--muted); }
    .field input, .field select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 8px 10px; border-radius: 8px; font-size: 14px;
    }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .barthes-pill {
      display: flex; align-items: center; gap: 6px; padding: 5px 12px;
      border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.03em;
      border: 1px solid var(--border); background: rgba(56,189,248,0.12); color: var(--primary);
    }
    .barthes-DEGRE_ZERO { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.4); color: #86efac; }
    .barthes-STUDIUM { background: rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.45); color: #7dd3fc; }
    .barthes-CONNOTATION { background: rgba(245,158,11,0.18); border-color: rgba(245,158,11,0.5); color: #fcd34d; }
    .barthes-PRESENCE { background: rgba(168,85,247,0.2); border-color: rgba(168,85,247,0.55); color: #e9d5ff; }
    .barthes-PUNCTUM { background: rgba(239,68,68,0.24); border-color: var(--crit); color: #fecaca; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }
    .deck-telemetry { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
    .grafana-bar, .dashboard-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
      overflow-x: auto; min-height: 44px;
    }
    .dashboard-wrap {
      display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    }
    .dashboard-img-container {
      flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; background: #090d16; width: 100%; height: calc(100% - 44px);
    }
    .dashboard-render-img {
      width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 4px;
    }
    .render-badge {
      display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 999px; background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4); color: var(--primary); white-space: nowrap;
    }
    .metric-card {
      background: linear-gradient(145deg, rgba(17,24,39,0.95), rgba(30,41,59,0.65));
      border: 1px solid var(--border); border-radius: 16px; padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .bar-track { height: 7px; border-radius: 999px; background: var(--bg); overflow: hidden; margin-top: 10px; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width 0.35s ease; }
    .deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
    .week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
    .week-day {
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px; min-height: 150px; display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    }
    .week-day:hover { border-color: var(--primary); }
    .week-day.weekend {
      background: rgba(139, 92, 246, 0.09);
      border-color: rgba(139, 92, 246, 0.35);
    }
    .week-day.holiday {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.5);
    }
    .week-day.today { border-color: var(--primary); background: rgba(56,189,248,0.10); }
    .week-day-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .evt-chip {
      background: var(--surface2); border-left: 3px solid var(--primary); border-radius: 6px;
      padding: 6px 8px; font-size: 12px; line-height: 1.3;
    }
    .evt-chip.recurring {
      border-left-color: var(--ok);
      background: rgba(34, 197, 94, 0.10);
    }
    .ed-bounds-box {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.42);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11px;
      line-height: 1.4;
    }
    .week-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
    .week-pill {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 6px; text-align: center; font-size: 11px;
    }
    .week-pill.weekend {
      background: rgba(139, 92, 246, 0.12);
      border-color: rgba(139, 92, 246, 0.38);
    }
    .week-pill.holiday {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.52);
    }
    .week-pill.today { border-color: var(--primary); background: rgba(56,189,248,0.14); }
    @media (max-width: 1100px) {
      .grid-2 { grid-template-columns: 1fr; height: auto; }
      .week-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .deck-telemetry { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .deck-tile {
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
      min-height: 132px; padding: 16px; border-radius: 18px; cursor: pointer; text-align: left;
      background: linear-gradient(160deg, rgba(30,41,59,0.9), rgba(15,23,42,0.95));
      border: 1px solid var(--border); color: var(--text);
      box-shadow: 0 8px 0 rgba(2,6,23,0.7), 0 12px 24px rgba(0,0,0,0.35);
      transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.15s ease;
    }
    .deck-tile:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 rgba(2,6,23,0.7), 0 4px 10px rgba(0,0,0,0.35);
    }
    .deck-icon { font-size: 32px; line-height: 1; }
    .deck-cat { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .kpi-grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
    .kpi-card {
      background: linear-gradient(155deg, rgba(17,24,39,0.96), rgba(30,41,59,0.72));
      border: 1px solid var(--border); border-radius: 16px; padding: 16px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    }
    .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; display: flex; justify-content: space-between; align-items: center; }
    .kpi-value { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .kpi-sub { font-size: 12px; color: var(--muted); }
    .presence-strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .presence-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
      border-radius: 999px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface2); color: var(--muted);
    }
    .presence-pill.home { background: rgba(34,197,94,0.14); border-color: rgba(34,197,94,0.45); color: #86efac; }
    .proxmox-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .node-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    }
    .mini-bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 6px; }
    .mini-bar-row .bar-track { flex: 1; margin-top: 0; height: 6px; }
    .plug-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .plug-row:last-child { border-bottom: none; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
      background: rgba(56,189,248,0.16); color: var(--primary);
    }
    .evt-chip.ed { border-left-color: #a855f7; background: rgba(168,85,247,0.10); }
    .evt-chip.cancelled { border-left-color: var(--crit); opacity: 0.65; }
    .news-filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .news-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .news-card {
      background: linear-gradient(155deg, rgba(17,24,39,0.96), rgba(30,41,59,0.68));
      border: 1px solid var(--border); border-radius: 16px; padding: 16px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
      transition: border-color 0.15s ease;
    }
    .news-card:hover { border-color: var(--primary); }
    .news-title { color: var(--text); font-weight: 700; font-size: 15px; line-height: 1.35; text-decoration: none; }
    .news-title:hover { color: var(--primary); }
    .news-desc {
      color: var(--muted); font-size: 13px; line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    @media (max-width: 1100px) {
      .kpi-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .proxmox-grid { grid-template-columns: 1fr; }
      .news-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .news-grid { grid-template-columns: 1fr; }
    }
    .reports-list { display: flex; flex-direction: column; gap: 14px; }
    .report-card {
      background: linear-gradient(155deg, rgba(17,24,39,0.96), rgba(30,41,59,0.68));
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .report-card.status-succeeded { border-left-color: var(--ok); }
    .report-card.status-warning { border-left-color: var(--warn); }
    .report-card.status-failed { border-left-color: var(--crit); }
    .report-card.status-running { border-left-color: var(--primary); }
    .report-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .report-status-pill.succeeded { background: rgba(34,197,94,0.18); color: #86efac; border: 1px solid rgba(34,197,94,0.45); }
    .report-status-pill.warning { background: rgba(245,158,11,0.18); color: #fde68a; border: 1px solid rgba(245,158,11,0.45); }
    .report-status-pill.failed { background: rgba(239,68,68,0.2); color: #fecaca; border: 1px solid rgba(239,68,68,0.45); }
    .report-status-pill.running { background: rgba(56,189,248,0.2); color: #7dd3fc; border: 1px solid rgba(56,189,248,0.45); }
    .report-prompt {
      background: rgba(9,13,22,0.72);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
    }
    .report-pre {
      background: #060911;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 420px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="hud" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-wrap">
          <div class="brand-logo">👁️</div>
          <div class="brand-text">
            <div class="brand">IRIS</div>
            <div class="brand-sub">Cockpit • jo3</div>
          </div>
        </div>
        <button id="btn-collapse-sidebar" class="sidebar-collapse-btn" title="Réduire / Agrandir le menu latéral">◀</button>
      </div>

      <nav class="sidebar-nav">
        <div id="screen-pills"></div>

        <div class="nav-section">
          <div class="nav-section-title">Configuration & Pilotage</div>
          <button class="nav-item" id="btn-screens" title="Gestion des écrans">
            <span class="nav-icon">🖥️</span>
            <span class="nav-text">Gestion des Écrans</span>
          </button>
          <button class="nav-item" id="btn-settings" title="Réglages Iris & MQTT">
            <span class="nav-icon">⚙️</span>
            <span class="nav-text">Réglages & Intégrations</span>
          </button>
          <button class="nav-item" id="btn-rotation" title="Activer / Mettre en pause la rotation automatique">
            <span class="nav-icon" id="rotation-icon">⏸️</span>
            <span class="nav-text" id="rotation-label">Rotation : Pause</span>
          </button>
          <button class="nav-item" id="btn-reload" title="Actualiser et recharger tous les flux">
            <span class="nav-icon">↻</span>
            <span class="nav-text">Actualiser les Flux</span>
          </button>
          <button class="nav-item" id="btn-hide-hud" title="Masquer la barre latérale (Mode Kiosk plein écran)">
            <span class="nav-icon">⛶</span>
            <span class="nav-text">Mode Kiosk Plein Écran</span>
          </button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div id="barthes-pill" class="barthes-pill barthes-DEGRE_ZERO" title="État sémiotique Roland Barthes">
          <span>✨</span>
          <span class="barthes-label-text" id="barthes-label">Degré zéro</span>
        </div>
        <div class="mqtt-badge" title="Statut du broker MQTT">
          <span id="mqtt-dot" class="dot"></span>
          <span id="mqtt-label">MQTT: …</span>
        </div>
      </div>
    </aside>

    <div class="main-area">
      <div id="alert-banner" class="alert-banner">
        <div>
          <span id="alert-severity" class="alert-tag">CRITIQUE</span>
          <strong id="alert-title">Incident</strong>
          <span id="alert-meta" style="color: var(--muted); font-size: 13px; margin-left: 8px;"></span>
          <div id="alert-message" style="margin-top: 4px; font-size: 14px;"></div>
        </div>
        <div class="row">
          <button class="btn" id="btn-alert-ack">Acquitter</button>
          <button class="btn ok" id="btn-alert-clear">Résolu</button>
        </div>
      </div>

      <main id="stage" class="stage"></main>
    </div>
  </div>

  <button id="btn-show-hud" class="btn primary floating-hud-btn">☰ Menu Iris</button>

  <div id="modal-screens" class="modal-backdrop">
    <div class="modal">
      <div class="row" style="justify-content: space-between; margin-bottom: 16px;">
        <h2>Gestion des écrans</h2>
        <button class="btn" onclick="closeModal('modal-screens')">Fermer</button>
      </div>
      <div id="screens-list"></div>
      <hr style="border-color: var(--border); margin: 16px 0;" />
      <h3 style="margin-bottom: 10px;">Ajouter / Modifier un écran</h3>
      <div class="row">
        <div class="field" style="flex:1"><label>ID</label><input id="scr-id" placeholder="o2-custom" /></div>
        <div class="field" style="flex:2"><label>Nom</label><input id="scr-name" placeholder="OpenObserve Logs" /></div>
        <div class="field" style="flex:1">
          <label>Type</label>
          <select id="scr-type">
            <option value="OPENOBSERVE">OpenObserve</option>
            <option value="GRAFANA">Grafana</option>
            <option value="WEB">Web / URL</option>
            <option value="ORG_OVERVIEW">Org — Hub</option>
            <option value="ORG_HOME">Maison & Énergie</option>
            <option value="ORG_LIFE_INFRA">Vie Quotidienne & Infra</option>
            <option value="ORG_NEWS">Actualités Kusanagi</option>
            <option value="ORG_AGENTS">Rapports Agents & Upgrades</option>
            <option value="ORG_STREAM_DECK">Stream Deck & PC</option>
            <option value="ORG_AGENDA">Org — Planning & Mails</option>
            <option value="ORG_NOTES">Org — Notes</option>
            <option value="ORG_CLOCK">Org — Horloge</option>
          </select>
        </div>
      </div>
      <div class="field"><label>URL</label><input id="scr-url" placeholder="https://o2-openobserve.p.zacharie.org/web/dashboards" /></div>
      <div class="row" style="margin-bottom: 12px;">
        <label><input type="checkbox" id="scr-alert" /> Écran d'alerte par défaut</label>
        <label><input type="checkbox" id="scr-enabled" checked /> Activé</label>
      </div>
      <button class="btn primary" id="btn-save-screen">Enregistrer l'écran</button>
    </div>
  </div>

  <div id="modal-settings" class="modal-backdrop">
    <div class="modal">
      <div class="row" style="justify-content: space-between; margin-bottom: 16px;">
        <h2>Réglages Iris</h2>
        <button class="btn" onclick="closeModal('modal-settings')">Fermer</button>
      </div>
      <div class="row">
        <div class="field" style="flex:2"><label>Broker MQTT Host</label><input id="cfg-host" /></div>
        <div class="field" style="flex:1"><label>Port</label><input id="cfg-port" type="number" /></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1"><label>Device ID</label><input id="cfg-device" /></div>
        <div class="field" style="flex:1"><label>Base Topic</label><input id="cfg-topic" /></div>
        <div class="field" style="flex:1"><label>Rotation (sec)</label><input id="cfg-rot-sec" type="number" /></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1"><label>Ville Météo</label><input id="cfg-weather-city" /></div>
        <div class="field" style="flex:2"><label>URL Calendrier iCal (.ics)</label><input id="cfg-ical-url" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics" /></div>
      </div>
      <div class="field"><label>Dépôts GitHub suivis (séparés par virgule)</label><input id="cfg-github-repos" placeholder="JZacharie/jo3, JZacharie/Iris, JZacharie/Kusanagi, JZacharie/Pylos" /></div>
      <div class="row" style="margin-bottom: 16px;">
        <label><input type="checkbox" id="cfg-mqtt-enabled" /> MQTT actif</label>
        <label><input type="checkbox" id="cfg-rot-enabled" /> Rotation auto</label>
      </div>
      <div class="row" style="justify-content: space-between;">
        <button class="btn danger" id="btn-sim-alert">Simuler un incident</button>
        <button class="btn primary" id="btn-save-settings">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
