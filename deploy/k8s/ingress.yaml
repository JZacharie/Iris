apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iris
  namespace: iris
  annotations:
    kubernetes.io/ingress.class: cloudflare-tunnel
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: iris.zacharie.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iris
                port:
                  number: 80
